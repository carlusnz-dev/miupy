[package]
name = "miupy-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
rustypipe = ["dep:rustypipe", "dep:rustypipe-downloader"]

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false }
lofty = "0.25.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["process", "fs", "io-util", "sync", "time", "macros", "rt", "rt-multi-thread"] }
tokio-util = "0.7.20"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["test-util"] }

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.9.0", features = ["bindgen"] }
rustls = "0.23.45"
webpki-roots = "1.0.9"

[dependencies.rustypipe]
version = "0.11.4"
optional = true
default-features = false
features = ["rustls-tls-webpki-roots"]

[dependencies.rustypipe-downloader]
version = "0.3.1"
optional = true
default-features = false
features = ["rustls-tls-webpki-roots"]
