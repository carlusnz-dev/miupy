[package]
name = "miupy-core"
version.workspace = true
edition.workspace = true

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "collation"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v7"] }
