# Portões de merge do miupy. Os nomes dos jobs (rust, frontend, docs, regras-do-fluxo) são os
# checks obrigatórios do ruleset; não renomeie sem atualizar docs/contribuicao/protecao-de-branches.json.
name: CI

on:
  pull_request:
    branches: [develop, main]
    # `edited` reavalia o título quando alguém o corrige.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]
  # O matriz.yml dispara este workflow depois de commitar a matriz: push feito com GITHUB_TOKEN
  # não dispara `pull_request`, e sem isso o commit do bot ficaria sem checks.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dependências do Tauri 2 no Linux (https://v2.tauri.app/start/prerequisites/) mais a
      # libasound2-dev, que o cpal (miupy-audio) exige.
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # O tauri::generate_context! exige que `frontendDist` (../dist) exista na compilação. O
      # frontend é construído e verificado no job `frontend`; aqui basta um stub.
      - name: Stub do frontend
        run: |
          mkdir -p dist
          echo '<!doctype html><title>miupy</title>' > dist/index.html

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Os testes #[ignore] (rede real, áudio) ficam de fora: não rodam sem --ignored.
      - run: cargo test --workspace --locked

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: IDs de requisito anotados existem
        run: node scripts/rastreabilidade.mjs --check
      - name: Testes das regras de fluxo
        run: node --test scripts/ci/
      # Em PR de branch do próprio repositório para develop, o matriz.yml regenera a matriz e
      # commita no branch; exigir a matriz em dia aqui deixaria o PR vermelho antes do commit
      # do bot. Em todo o resto (fork, PR para main, push, execução disparada pelo matriz.yml)
      # a matriz tem de estar em dia.
      - name: Matriz em dia
        if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          node scripts/rastreabilidade.mjs
          if ! git diff --exit-code -- docs/rastreabilidade; then
            echo "::error::A matriz de rastreabilidade está desatualizada. Rode 'npm run docs:matriz' e faça commit."
            exit 1
          fi

  regras-do-fluxo:
    name: regras-do-fluxo
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # as tags v* entram na comparação de versões
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Título, branch de origem e destino
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          TITULO: ${{ github.event.pull_request.title }}
        run: node scripts/ci/verificar-pr.mjs --head "$HEAD_REF" --base "$BASE_REF" --titulo "$TITULO"
      - name: Versões do PR para main
        if: ${{ github.base_ref == 'main' }}
        run: node scripts/ci/verificar-versoes.mjs --maior-que-a-ultima-tag
